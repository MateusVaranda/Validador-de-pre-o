
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Validação de Financiamento</title>
</head>

<body>

    <main>

        <!-- ÁREA PRINCIPAL -->
        <section class="validate">

            <h1>Validação de Financiamento</h1>

            <form id="financing-form">

                <label for="price-total">Qual valor da sua compra?</label>

                <input
                    type="number"
                    id="price-total"
                    placeholder="R$ 50.000,00"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="price-entry">Qual valor da sua entrada?</label>

                <input
                    type="number"
                    id="price-entry"
                    placeholder="R$ 10.000,00"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit" id="button-check">Verificar financiamento</button>

            </form>

        </section>


        <!-- ÁREA DE RESULTADO -->
        <section class="result" id="result" hidden> <!--O hidden está ja escondendo nosso elemento, a nossa section-->

            <h2>Resultado da análise</h2>

            <p id="result-total"></p>

            <p id="result-entry"></p>

            <p id="result-status"></p>

            <p id="result-balance"></p>

        </section>

    </main>

</body>

<script src="script.js"></script>

</html>
